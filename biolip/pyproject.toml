[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biolip"
version = "0.1.0"
description = "BioLip-style lip-motion video branch refactored from a Colab notebook"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "tqdm",
    "huggingface_hub",
    "opencv-python",
    "mediapipe",
    "torch",
    "accelerate",
    "matplotlib",
    "pyarrow",
]


[project.optional-dependencies]
dev = ["black"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.poetry]
package-mode = false